# Linux release for direct-binary deploys (e.g. small VPSes that cannot build).
# On tag push: builds the release binary + web dist, packs them into a tarball,
# and attaches it to a public GitHub Release. The VPS downloads the asset with
# curl — no build ever runs on the server.

name: Linux Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Build web frontend
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build release binary
        run: cargo build --release --locked

      - name: Pack tarball
        run: |
          mkdir -p staging
          cp target/release/Mori staging/Mori
          cp -r dist staging/dist
          cp items.dat staging/items.dat
          cp -r assets staging/assets
          tar -czf mori-linux-x86_64.tar.gz -C staging .

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: mori-linux-x86_64.tar.gz
